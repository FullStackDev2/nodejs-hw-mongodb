tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: Returns paginated contacts for the authenticated user.
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      example: 1
  - in: query
    name: perPage
    schema:
      type: integer
      example: 10
  - in: query
    name: sortBy
    schema:
      type: string
      example: name
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: [asc, desc]
      example: asc
  - in: query
    name: type
    schema:
      type: string
      enum: [work, home, personal]
      example: personal
  - in: query
    name: isFavourite
    schema:
      type: boolean
      example: true
responses:
  '200':
    description: Successfully found contacts
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              $ref: ../../components/schemas/pagination.yaml
  '401':
    description: Authorization header missing
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/error.yaml
